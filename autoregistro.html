<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Autorregistro - Souvenirs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; font-size: 14px; justify-content: center; align-items: center; padding: 12px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 420px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
        input[type="text"], input[type="tel"] { width: 100%; padding: 11px 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; outline: none; }
        input:focus { border-color: var(--primary); background: white; }
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 13px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
        .photo-buttons { display: flex; gap: 8px; }
        .photo-btn { flex: 1; padding: 9px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .photo-preview { margin-top: 8px; width: 50px; height: 50px; border-radius: 8px; border: 1px solid var(--border); position: relative; overflow: hidden; display: none; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-remove { position: absolute; top: 1px; right: 1px; background: var(--danger); color: white; border: none; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; cursor: pointer; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 1000; }
        .modal-content { background: white; border-radius: 16px; max-width: 340px; width: 100%; overflow: hidden; }
        .modal-header { padding: 12px 14px; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; }
        .modal-body { padding: 12px; text-align: center; }
        .modal-footer { padding: 10px 14px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 6px; }
        video { width: 100%; max-height: 200px; background: black; border-radius: 10px; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="card">
        <div style="text-align: center; margin-bottom: 16px;">
            <div style="background:#e0e7ff; color:var(--primary); width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:18px;">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h2 style="font-size: 16px; font-weight: 700;">Autorregistro de Asistente</h2>
            <p style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Ingresa tus datos para generar tu código y reclamar tu obsequio.</p>
        </div>

        <form id="self-reg-form" onsubmit="handleSelfRegister(event)">
            <div class="form-group">
                <label>Número de Cédula</label>
                <input type="text" id="self-id" required placeholder="Número de cédula">
            </div>
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="self-name" required placeholder="Tu nombre y apellido">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="self-phone" required placeholder="Ej. 3001234567">
            </div>
            <div class="form-group">
                <label>Fotografía (Opcional)</label>
                <div class="photo-buttons">
                    <button type="button" class="photo-btn" onclick="openCameraModal()"><i class="fa-solid fa-camera" style="color:var(--primary);"></i> Cámara</button>
                    <label class="photo-btn"><i class="fa-solid fa-upload" style="color:var(--primary);"></i> Archivo<input type="file" id="self-photo-file" accept="image/*" class="hidden" onchange="handleFileSelected(event)"></label>
                </div>
                <div id="photo-preview-container" class="photo-preview"><img id="photo-preview-img" src="" alt="Preview"><button type="button" class="photo-remove" onclick="clearPhoto()">✕</button></div>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 6px;">Generar Código QR</button>
        </form>

        <div id="qr-result-card" class="hidden" style="text-align: center; margin-top: 12px; padding: 14px; background: #f8fafc; border-radius: 14px; border: 1px solid var(--border);">
            <div style="display:inline-block; background:#d1fae5; color:#065f46; padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; margin-bottom:6px;">¡Pre-registro Exitoso!</div>
            <p style="font-size:11px; color:var(--text-muted);">Presenta este código en la mesa de entrega:</p>
            <div id="display-claim-code" style="font-size: 22px; font-weight: 900; color: var(--primary); margin: 6px 0;">---</div>
            <div id="qrcode-container" style="display: inline-block; background: white; padding: 8px; border-radius: 8px; border: 1px solid var(--border);"></div>
            <div style="margin-top: 12px;">
                <button type="button" onclick="resetSelfForm()" style="background:var(--border); border:none; padding:7px 14px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;">Registrar Otro</button>
            </div>
        </div>
    </div>

    <div id="camera-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><span>Tomar Fotografía</span><button onclick="closeCameraModal()" style="background:none; border:none; cursor:pointer;">✕</button></div>
            <div class="modal-body"><video id="camera-video" autoplay playsinline></video><canvas id="camera-canvas" class="hidden"></canvas></div>
            <div class="modal-footer"><button onclick="closeCameraModal()" style="background:var(--border); border:none; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;">Cancelar</button><button onclick="capturePhoto()" class="btn-primary" style="width: auto; padding: 6px 14px; font-size:11px;">Capturar</button></div>
        </div>
    </div>

    <script>
        let currentPhotoData = null;
        let mediaStream = null;

        function compressImage(fileOrDataUrl, callback) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > 300) { height = Math.round((height * 300) / width); width = 300; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = fileOrDataUrl;
        }

        function handleFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => compressImage(e.target.result, compressed => {
                currentPhotoData = compressed;
                document.getElementById('photo-preview-img').src = compressed;
                document.getElementById('photo-preview-container').style.display = 'block';
            });
            reader.readAsDataURL(file);
        }

        function clearPhoto() {
            currentPhotoData = null;
            document.getElementById('photo-preview-container').style.display = 'none';
            document.getElementById('self-photo-file').value = '';
        }

        async function openCameraModal() {
            document.getElementById('camera-modal').style.display = 'flex';
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                document.getElementById('camera-video').srcObject = mediaStream;
            } catch (err) { alert('No se pudo acceder a la cámara.'); closeCameraModal(); }
        }

        function closeCameraModal() {
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            document.getElementById('camera-modal').style.display = 'none';
        }

        function capturePhoto() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            compressImage(canvas.toDataURL('image/jpeg'), compressed => {
                currentPhotoData = compressed;
                document.getElementById('photo-preview-img').src = compressed;
                document.getElementById('photo-preview-container').style.display = 'block';
                closeCameraModal();
            });
        }

        function handleSelfRegister(event) {
            event.preventDefault();
            const id = document.getElementById('self-id').value.trim();
            const name = document.getElementById('self-name').value.trim();
            const phone = document.getElementById('self-phone').value.trim();

            let deliveredList = JSON.parse(localStorage.getItem('souvenir_delivered') || '[]');
            let pendingList = JSON.parse(localStorage.getItem('souvenir_pending') || '[]');

            if (deliveredList.some(i => i.id === id)) {
                alert('Esta cédula ya recibió su souvenir.');
                return;
            }

            const claimCode = 'SRV-' + Math.floor(1000 + Math.random() * 9000);
            pendingList = pendingList.filter(i => i.id !== id);
            pendingList.unshift({ id, code: claimCode, name, phone, photo: currentPhotoData || '' });

            localStorage.setItem('souvenir_pending', JSON.stringify(pendingList));

            document.getElementById('display-claim-code').textContent = claimCode;
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: claimCode, width: 120, height: 120, colorDark: "#4f46e5", colorLight: "#ffffff" });

            document.getElementById('self-reg-form').classList.add('hidden');
            document.getElementById('qr-result-card').classList.remove('hidden');
        }

        function resetSelfForm() {
            document.getElementById('self-reg-form').reset();
            clearPhoto();
            document.getElementById('qr-result-card').classList.add('hidden');
            document.getElementById('self-reg-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
