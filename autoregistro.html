<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorregistro - Reclamo de Souvenir</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-md w-full bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center mb-6">
            <div class="bg-indigo-50 text-indigo-600 w-12 h-12 rounded-2xl mx-auto flex items-center justify-center text-xl mb-3">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <h2 class="text-xl font-bold text-slate-800">Autorregistro de Asistente</h2>
            <p class="text-xs text-slate-500 mt-1">Ingresa tus datos para generar tu código y reclamar tu obsequio.</p>
        </div>

        <!-- Alerta de validación en pantalla -->
        <div id="self-alert-box" class="hidden p-3 rounded-xl mb-4 text-sm font-medium"></div>

        <form id="self-reg-form" onsubmit="handleSelfRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Número de Cédula</label>
                <input type="text" id="self-id" required placeholder="Número de identificación" 
                    class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Nombre Completo</label>
                <input type="text" id="self-name" required placeholder="Tu nombre y apellido" 
                    class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Teléfono de Contacto</label>
                <input type="tel" id="self-phone" required placeholder="Ej. 3001234567" 
                    class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Fotografía (Opcional)</label>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="openCameraModal()" class="flex-1 py-2 px-3 bg-slate-100 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-camera text-indigo-600"></i> Tomar Foto
                    </button>
                    <label class="flex-1 py-2 px-3 bg-slate-100 border border-slate-300 rounded-xl text-xs font-semibold text-slate-700 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-upload text-indigo-600"></i> Subir Archivo
                        <input type="file" id="self-photo-file" accept="image/*" class="hidden" onchange="handleFileSelected(event)">
                    </label>
                </div>
                <div id="photo-preview-container" class="hidden mt-3 relative w-20 h-20 border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <img id="photo-preview-img" src="" class="w-full h-full object-cover">
                    <button type="button" onclick="clearPhoto()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">×</button>
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-sm transition">
                <i class="fa-solid fa-qrcode mr-2"></i> Generar Mi Código de Reclamo
            </button>
        </form>

        <div id="qr-result-card" class="hidden mt-6 p-6 bg-slate-50 border border-slate-200 rounded-2xl text-center space-y-4">
            <div class="inline-block bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">¡Pre-registro Exitoso!</div>
            <p class="text-xs text-slate-600">Presenta este código en la mesa de entrega:</p>
            <div class="text-2xl font-black text-indigo-600 tracking-wider" id="display-claim-code">---</div>
            <div id="qrcode-container" class="bg-white p-4 rounded-xl inline-block border"></div>
            <div><button onclick="resetForm()" class="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">Registrar Otro</button></div>
        </div>
    </div>

    <div id="camera-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden flex flex-col">
            <div class="p-4 bg-slate-50 border-b flex justify-between items-center"><h3 class="font-bold text-sm">Tomar Foto</h3><button onclick="closeCameraModal()"><i class="fa-solid fa-xmark"></i></button></div>
            <div class="p-4 bg-black relative flex justify-center"><video id="camera-video" autoplay playsinline class="w-full max-h-72 object-cover rounded-xl"></video><canvas id="camera-canvas" class="hidden"></canvas></div>
            <div class="p-4 bg-slate-50 border-t flex justify-end gap-2">
                <button onclick="closeCameraModal()" class="px-4 py-2 bg-slate-200 text-xs font-bold rounded-xl">Cancelar</button>
                <button onclick="capturePhoto()" class="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl">Capturar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ========================================================
        // REEMPLAZA ESTE BLOQUE CON TUS CREDENCIALES REALES DE FIREBASE
        // ========================================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_DOMINIO.firebaseapp.com",
            databaseURL: "https://TU_BASE_DE_DATOS.firebaseio.com",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_BUCKET.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentPhotoData = null;
        let mediaStream = null;

        window.handleSelfRegister = async function(event) {
            event.preventDefault();
            const idVal = document.getElementById('self-id').value.trim();
            const nameVal = document.getElementById('self-name').value.trim();
            const phoneVal = document.getElementById('self-phone').value.trim();

            const dbRef = ref(db);
            
            // Validar en Firebase si ya se entregó el souvenir a esta cédula
            const deliveredSnap = await get(child(dbRef, 'delivered'));
            if (deliveredSnap.exists()) {
                const deliveredList = Object.values(deliveredSnap.val());
                if (deliveredList.some(i => i.id === idVal)) {
                    showSelfAlert('¡RESTRICCIÓN! Esta cédula ya recibió su obsequio y no puede registrarse nuevamente.', 'error');
                    return;
                }
            }

            // Validar en Firebase si ya está en la fila de pre-registrados pendientes
            const pendingSnap = await get(child(dbRef, 'pending'));
            if (pendingSnap.exists()) {
                const pendingList = Object.values(pendingSnap.val());
                if (pendingList.some(i => i.id === idVal)) {
                    showSelfAlert('¡AVISO! Esta cédula ya cuenta con un pre-registro activo en la fila.', 'error');
                    return;
                }
            }

            const claimCode = 'SRV-' + Math.floor(1000 + Math.random() * 9000);

            // Guardar en la base de datos de pendientes en la nube
            push(ref(db, 'pending'), {
                id: idVal,
                code: claimCode,
                name: nameVal,
                phone: phoneVal,
                photo: currentPhotoData || ''
            });

            document.getElementById('display-claim-code').textContent = claimCode;
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, { text: claimCode, width: 150, height: 150, colorDark: "#4f46e5", colorLight: "#ffffff" });

            document.getElementById('self-reg-form').classList.add('hidden');
            document.getElementById('qr-result-card').classList.remove('hidden');
        };

        function showSelfAlert(msg, type) {
            const box = document.getElementById('self-alert-box');
            box.className = `p-3 rounded-xl mb-4 text-sm font-medium border flex items-center gap-2 ${type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-red-50 text-red-800 border-red-200'}`;
            box.innerHTML = `<span>${msg}</span>`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 7000);
        }

        window.openCameraModal = async function() {
            document.getElementById('camera-modal').classList.remove('hidden');
            mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
            document.getElementById('camera-video').srcObject = mediaStream;
        };

        window.closeCameraModal = function() {
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            document.getElementById('camera-modal').classList.add('hidden');
        };

        window.capturePhoto = function() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = 300; canvas.height = (video.videoHeight * 300) / video.videoWidth;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            currentPhotoData = canvas.toDataURL('image/jpeg', 0.7);
            document.getElementById('photo-preview-img').src = currentPhotoData;
            document.getElementById('photo-preview-container').classList.remove('hidden');
            window.closeCameraModal();
        };

        window.clearPhoto = function() {
            currentPhotoData = null;
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('self-photo-file').value = '';
        };

        window.handleFileSelected = function(e) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300; canvas.height = (img.height * 300) / img.width;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentPhotoData = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('photo-preview-img').src = currentPhotoData;
                    document.getElementById('photo-preview-container').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.resetForm = function() {
            document.getElementById('self-reg-form').reset();
            window.clearPhoto();
            document.getElementById('qr-result-card').classList.add('hidden');
            document.getElementById('self-reg-form').classList.remove('hidden');
        };
    </script>
</body>
</html>
